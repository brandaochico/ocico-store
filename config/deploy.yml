# Name of your application. Used to uniquely configure containers.
service: ocico_store

# Name of the container image.
image: brandaochico/ocico-store

# A single Oracle Cloud Always Free VM (VM.Standard.A1.Flex: 2 OCPU / 12 GB,
# ARM64, Ubuntu 24.04, São Paulo). Scale the box vertically before going
# multi-server — see "Deploy" in docs/ARCHITECTURE.md.
servers:
  web:
    hosts:
      - 147.15.64.249

# Oracle's Ubuntu images log in as `ubuntu`, not root. Docker was installed by
# hand and `ubuntu` added to the docker group, so Kamal never needs sudo (it
# can't bootstrap Docker itself as a non-root user).
ssh:
  user: ubuntu
  keys_only: true
  keys:
    - ~/.ssh/ocico_deploy

# kamal-proxy handles TLS (Let's Encrypt) + zero-downtime releases — no manual
# nginx/certbot. Certificates are issued once DNS for these hosts points here.
proxy:
  ssl: true
  hosts:
    - ocico.store
    - www.ocico.store

# GitHub Container Registry, since the repo already lives on GitHub under brandaochico.
registry:
  server: ghcr.io
  username: brandaochico
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - OCICO_STORE_DATABASE_PASSWORD
  clear:
    # The db accessory below, by its container name on the kamal Docker network.
    DB_HOST: ocico_store-db

    # Canonical host: allowed Host header, and the host in links inside emails.
    APP_HOST: ocico.store

    # Run the Solid Queue supervisor inside Puma — no separate worker role
    # until there's a second web server (see docs/ARCHITECTURE.md).
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Active Storage files (product images) on a persistent volume.
volumes:
  - "ocico_store_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# The server is ARM64; building that image on an x86 laptop means QEMU
# emulation (slow, and flaky for native gems). So the image is built natively
# on the server itself, over SSH — ~/.ssh/config maps this host to the deploy
# key, since Docker's remote builder uses the system ssh client.
builder:
  arch: arm64
  remote: ssh://ubuntu@147.15.64.249

# Postgres runs as a Kamal accessory on the same VM. There's no Redis: jobs run
# on Solid Queue, backed by the dedicated `queue` Postgres database.
accessories:
  db:
    image: postgres:18
    host: 147.15.64.249
    # Bound to localhost only: reachable from the app over the kamal Docker
    # network, never from the internet.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: ocico_store
        POSTGRES_DB: ocico_store_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql
