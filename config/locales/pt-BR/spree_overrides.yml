# Overrides for specific Solidus-gem-owned keys (config/locales/pt-BR fallback
# is :en per config/application.rb, so any key we don't override here shows in
# English until someone notices and adds it — expected, not exhaustive by design).
#
# The `spree:` block below covers every gem key the storefront views actually
# reference. It was built from that list, not guessed: a key that no view uses
# is deliberately absent rather than translated speculatively.
"pt-BR":
  spree:
    continue_shopping: "Continuar comprando"
    look_for_similar_items: "Veja também"

    # Navegação e conta
    home: "Início"
    account: "Conta"
    my_account: "Minha conta"
    my_orders: "Meus pedidos"
    orders: "Pedidos"
    login: "Entrar"
    logout: "Sair"
    or: "ou"
    create: "Criar"
    create_a_new_account: "Criar uma conta"
    login_as_existing: "Entrar com uma conta existente"
    new_customer: "Novo cliente"
    # `sign_up` não existe nem no en do Solidus: o BreadcrumbsComponent pede
    # spree.sign_up e o Rails vinha humanizando a chave em "Sign Up".
    sign_up: "Criar conta"
    guest_user_account: "Comprar sem cadastro"
    editing_user: "Editando usuário"
    back_to_store: "Ver a loja"
    categories: "Categorias"
    products: "Produtos"
    search: "Buscar"
    search_results: "Resultados para '%{keywords}'"
    no_products_found: "Nenhum produto encontrado"

    # Credenciais
    email: "E-mail"
    password: "Senha"
    confirm_password: "Confirmação de senha"
    remember_me: "Lembrar de mim"
    forgot_password: "Esqueceu a senha?"
    change_my_password: "Alterar minha senha"
    reset_password: "Redefinir minha senha"

    # Catálogo
    add_to_cart: "Adicionar ao carrinho"
    out_of_stock: "Esgotado"
    variants: "Variações"
    properties: "Características"
    promotion: "Promoção"
    promotions: "Promoções"
    product_has_no_description: "Este produto não tem descrição."
    product_not_available_in_this_currency: "Este produto não está disponível na moeda selecionada."

    # Carrinho
    cart: "Carrinho"
    shopping_cart: "Carrinho de compras"
    your_cart_is_empty: "Seu carrinho está vazio"
    coupon_code: "Cupom de desconto"
    apply_code: "Aplicar cupom"
    subtotal: "Subtotal"
    item_total: "Total dos itens"
    total: "Total"
    order_total: "Total do pedido"
    order_summary: "Resumo do pedido"
    adjustment: "Ajuste"
    tax: "Impostos"

    # Checkout
    checkout: "Finalizar compra"
    confirm: "Confirmar"
    continue: "Continuar"
    save_and_continue: "Salvar e continuar"
    place_order: "Finalizar pedido"
    payment_information: "Dados de pagamento"
    agree_to_terms_of_service: "Li e aceito os termos de serviço"
    there_were_problems_with_the_following_fields: "Corrija os campos abaixo"
    thank_you_for_your_order: "Obrigado pela sua compra. Guarde ou imprima esta página de confirmação para seus registros."
    order_processed_successfully: "Seu pedido foi realizado com sucesso."

    # Endereço — "zip" é o CEP, e "state" aqui é a unidade federativa, não um status
    name: "Nome"
    company: "Empresa"
    street_address: "Rua / Avenida"
    street_address_2: "Complemento"
    city: "Cidade"
    state: "Estado"
    country: "País"
    zip: "CEP"
    phone: "Telefone"
    alternative_phone: "Telefone alternativo"
    billing_address: "Endereço de cobrança"
    shipping_address: "Endereço de entrega"
    use_billing_address: "Usar o endereço de cobrança"
    save_my_address: "Salvar meu endereço"

    # Entrega
    shipping: "Frete"
    shipping_total: "Total do frete"
    shipping_method: "Forma de envio"
    shipping_instructions: "Instruções de entrega"
    shipments: "Entregas"
    shipment_state: "Status da entrega"
    unshippable_items: "Itens indisponíveis para envio"
    tracking: "Rastreamento"
    package_from: "pacote de"
    # The stock location ("default") means nothing to a customer.
    shipment_details: "%{shipping_method}"
    order_number: "Pedido %{number}"
    payment_states:
      balance_due: "Aguardando pagamento"
      checkout: "Em andamento"
      completed: "Finalizado"
      credit_owed: "Crédito a devolver"
      failed: "Falhou"
      invalid: "Inválido"
      paid: "Pago"
      pending: "Pendente"
      processing: "Processando"
      void: "Cancelado"

    # Pagamento — `check` é o método manual do Solidus (admin baixa o pagamento
    # à mão), não um cheque bancário; o nome literal confundiria o cliente.
    check: "Pagamento manual"
    card_number: "Número do cartão"
    card_code: "Código de segurança"
    name_on_card: "Nome impresso no cartão"
    expiration: "Validade"
    ending_in: "Final"
    payment_state: "Status do pagamento"

    # Plurais — o Solidus usa a forma pluralizada do I18n aqui, então o
    # override precisa trazer one:/other:, não uma string única.
    cart_subtotal:
      one: "Subtotal (1 item)"
      other: "Subtotal (%{count} itens)"
    errors_prohibited_this_record_from_being_saved:
      one: "1 erro impediu que este registro fosse salvo"
      other: "%{count} erros impediram que este registro fosse salvo"

    # Passos do checkout — aparecem na barra de progresso.
    order_state:
      address: "Endereço"
      delivery: "Entrega"
      payment: "Pagamento"
      confirm: "Confirmação"
      complete: "Concluído"
      cart: "Carrinho"
      # Estados de um pedido já finalizado, mostrados em "Minha conta".
      canceled: "Cancelado"
      returned: "Devolvido"
      awaiting_return: "Aguardando devolução"
      resumed: "Retomado"

    # Situação da entrega, também em "Minha conta".
    shipment_states:
      backorder: "Aguardando estoque"
      canceled: "Cancelado"
      partial: "Parcial"
      pending: "Pendente"
      ready: "Pronto para envio"
      shipped: "Enviado"

    # Mensagens (flash) que os controllers do storefront mostram ao cliente.
    logged_in_succesfully: "Você entrou na sua conta."
    account_updated: "Conta atualizada."
    cannot_edit_orders: "Só é possível alterar o carrinho atual."
    order_not_found: "Não encontramos o seu pedido. Tente de novo."
    order_mutex_error: "Algo deu errado. Tente de novo."
    please_enter_reasonable_quantity: "Informe uma quantidade válida."
    insufficient_stock_for_order: "Não há estoque suficiente para este pedido."
    inventory_error_flash_for_insufficient_quantity: "%{names} acabou de ficar indisponível."
    inventory_error_flash_for_insufficient_shipment_quantity: "A quantidade escolhida de %{unavailable_items} não está mais disponível. Revise o pedido e tente de novo."
    spree_gateway_error_flash_for_checkout: "Houve um problema com os dados de pagamento. Confira as informações e tente de novo."
    locale_changed: "Idioma alterado."
    locale_not_changed: "Não foi possível alterar o idioma."

    # E-mails transacionais (templates do solidus_core): confirmação,
    # cancelamento, envio com rastreio e reembolso.
    resend: "Reenvio"
    order_mailer:
      confirm_email:
        subject: "Confirmação do pedido"
        dear_customer: "Olá,"
        instructions: "Recebemos o seu pedido. Confira abaixo os detalhes e guarde este e-mail."
        order_summary: "Resumo do pedido"
        subtotal: "Subtotal:"
        total: "Total do pedido:"
        thanks: "Obrigado pela compra!"
      cancel_email:
        subject: "Cancelamento do pedido"
        dear_customer: "Olá,"
        instructions: "O seu pedido foi CANCELADO. Guarde este e-mail como registro do cancelamento."
        order_summary_canceled: "Resumo do pedido [CANCELADO]"
        subtotal: "Subtotal:"
        total: "Total do pedido:"
      inventory_cancellation:
        subject: "Cancelamento de itens"
        dear_customer: "Olá,"
        instructions: "Alguns itens do seu pedido foram CANCELADOS. Guarde este e-mail como registro do cancelamento."
        order_summary_canceled: "Itens cancelados"
    shipment_mailer:
      shipped_email:
        subject: "Pedido enviado"
        dear_customer: "Olá,"
        instructions: "O seu pedido foi enviado."
        shipment_summary: "Resumo do envio"
        thanks: "Obrigado pela compra!"
        track_information: "Código de rastreio: %{tracking}"
        track_link: "Acompanhe a entrega: %{url}"
    reimbursement_mailer:
      reimbursement_email:
        subject: "Reembolso processado"
        dear_customer: "Olá,"
        instructions: "O seu reembolso foi processado."
        refund_summary: "Resumo do reembolso"
        exchange_summary: "Resumo da troca"
        total_refunded: "Total reembolsado: %{total}"
        days_to_send: "Você tem %{days} dias para enviar de volta os itens aguardando troca."
        for: "por"

    # Genéricos
    date: "Data"
    status: "Status"
    edit: "Editar"
    update: "Atualizar"
    you_have_no_orders_yet: "Você ainda não fez nenhum pedido"

    actions:
      edit: "Editar"

    store_credit:
      store_credit: "Crédito na loja"

    i18n:
      language: "Idioma"

  # Devise (via solidus_auth_devise). A gem traz um pt-BR incompleto: as chaves
  # abaixo faltavam (e caíam no inglês) ou tinham erro de digitação.
  devise:
    failure:
      invalid: "E-mail ou senha inválidos."
      not_found_in_database: "E-mail ou senha inválidos."
      unconfirmed: "Você precisa confirmar sua conta antes de continuar."
    sessions:
      signed_in: "Você entrou na sua conta."
      signed_out: "Você saiu da sua conta."
      already_signed_out: "Você saiu da sua conta."
    passwords:
      send_instructions: "Se houver uma conta com esse e-mail, você vai receber em instantes as instruções para redefinir a senha."
      send_paranoid_instructions: "Se houver uma conta com esse e-mail, você vai receber em instantes as instruções para redefinir a senha."
      updated: "Senha alterada. Você já está conectado."
      updated_not_active: "Senha alterada."
      no_token: "Esta página só pode ser aberta pelo link do e-mail de redefinição de senha. Confira se usou o link completo."
    registrations:
      signed_up: "Boas-vindas! Sua conta foi criada."
      signed_up_but_unconfirmed: "Enviamos um link de confirmação para o seu e-mail. Abra-o para ativar a conta."
      updated: "Sua conta foi atualizada."
      destroyed: "Sua conta foi encerrada. Esperamos ver você de novo em breve."
    confirmations:
      send_paranoid_instructions: "Se o seu e-mail estiver cadastrado, você vai receber em instantes as instruções para confirmar a conta."

  errors:
    messages:
      # A gem traduz como "E-mail não pode estar em branco", mas a mensagem
      # aparece para e-mail inválido no checkout como visitante.
      email_is_invalid: "Informe um e-mail válido."

  solidus_stripe:
    loading: "Carregando..."

    # `unexpected_error` is the one key here that isn't an override: the gem
    # hardcodes this message in its Stimulus controller, so our copy of that
    # controller reads it from a Stimulus value instead (see
    # app/javascript/controllers/solidus_stripe_payment_controller.js).
    unexpected_error: "Ocorreu um erro inesperado. Tente novamente."

    # Shown to the customer by SolidusStripe::PaymentIntent when a payment
    # intent comes back in a non-final state.
    intent_status:
      canceled: "Seu pagamento foi cancelado."
      processing: "Seu pagamento está sendo processado."
      requires_action: "Seu pagamento precisa de uma confirmação adicional antes de prosseguir."
      requires_capture: "Pagamento autorizado com sucesso!"
      requires_confirmation: "Confirme o pagamento para prosseguir."
      requires_payment_method: "Seu pagamento não foi aprovado. Tente novamente."
      succeeded: "Pagamento aprovado!"

  activerecord:
    models:
      solidus_stripe/payment_source: "Fonte de pagamento Stripe"
      solidus_stripe/payment_method: "Forma de pagamento Stripe"
    attributes:
      # street_number/neighborhood are our own columns (app/overrides/brazilian_address.rb);
      # the rest are Solidus' — used in validation messages and both admins' labels.
      spree/address:
        name: "Nome"
        company: "Empresa"
        address1: "Rua / Avenida"
        address2: "Complemento"
        street_number: "Número"
        neighborhood: "Bairro"
        city: "Cidade"
        zipcode: "CEP"
        state: "Estado"
        state_name: "Estado"
        country: "País"
        phone: "Telefone"
      # Errors from the order's nested addresses ("bill_address.street_number").
      spree/order/bill_address:
        name: "Nome (endereço de cobrança)"
        address1: "Rua / Avenida (endereço de cobrança)"
        street_number: "Número (endereço de cobrança)"
        neighborhood: "Bairro (endereço de cobrança)"
        city: "Cidade (endereço de cobrança)"
        zipcode: "CEP (endereço de cobrança)"
        state: "Estado (endereço de cobrança)"
        country: "País (endereço de cobrança)"
        phone: "Telefone (endereço de cobrança)"
      spree/order/ship_address:
        name: "Nome (endereço de entrega)"
        address1: "Rua / Avenida (endereço de entrega)"
        street_number: "Número (endereço de entrega)"
        neighborhood: "Bairro (endereço de entrega)"
        city: "Cidade (endereço de entrega)"
        zipcode: "CEP (endereço de entrega)"
        state: "Estado (endereço de entrega)"
        country: "País (endereço de entrega)"
        phone: "Telefone (endereço de entrega)"
