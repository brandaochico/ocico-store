services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ocico_store
      POSTGRES_PASSWORD: ocico_store
      POSTGRES_DB: ocico_store_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocico_store"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
