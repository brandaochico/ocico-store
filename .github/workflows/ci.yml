name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      OCICO_STORE_DB_HOST: localhost
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ocico_store
          POSTGRES_PASSWORD: ocico_store
          POSTGRES_DB: ocico_store_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U ocico_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Solidus's default asset variant styles require the vips image processing
      # backend, which isn't preinstalled on GitHub-hosted runners.
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips

      - name: Run CI pipeline
        run: bin/ci
