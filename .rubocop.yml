# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# db/schema.rb is regenerated by `rails db:migrate`/`db:schema:dump` using
# Rails' own formatting, not ours — linting it just means re-autocorrecting
# it after every migration. Exclude it, same as any other generated file.
AllCops:
  Exclude:
    - "db/schema.rb"
