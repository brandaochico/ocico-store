# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# db/schema.rb is regenerated by `rails db:migrate`/`db:schema:dump` using
# Rails' own formatting, not ours — linting it just means re-autocorrecting
# it after every migration. Exclude it, same as any other generated file.
# Migrations copied in from an engine by `railties:install:migrations` are named
# <timestamp>_<name>.<engine>.rb. They're verbatim copies of gem code and must
# stay byte-identical to the engine's own, so linting them just creates drift.
AllCops:
  Exclude:
    - "db/schema.rb"
    - "db/migrate/*.*.rb"
